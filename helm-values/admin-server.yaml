nameOverride: admin-server

image:
  repository: localhost:5001/admin-server

service:
  port: 9090
  targetPort: 9090

env:
  - name: SPRING_PROFILES_ACTIVE
    value: docker
  - name: SERVER_PORT
    value: "9090"
  - name: SPRING_CLOUD_CONFIG_URI
    value: "http://config-server:8888"
  - name: SPRING_APPLICATION_JSON
    value: '{"eureka":{"client":{"serviceUrl":{"defaultZone":"http://discovery-server:8761/eureka/"}}}}'
  - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
    value: "true"

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 9090
  initialDelaySeconds: 200
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 3

initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until nc -z config-server 8888; do echo "waiting for config-server"; sleep 2; done
  - name: wait-for-discovery-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until nc -z discovery-server 8761; do echo "waiting for discovery-server"; sleep 2; done
