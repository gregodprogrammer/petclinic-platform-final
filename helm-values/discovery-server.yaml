nameOverride: discovery-server

image:
  repository: localhost:5001/discovery-server

service:
  port: 8761
  targetPort: 8761

env:
  - name: SPRING_PROFILES_ACTIVE
    value: docker
  - name: SERVER_PORT
    value: "8761"

livenessProbe:
  initialDelaySeconds: 120

initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until nc -z config-server 8888; do echo "waiting for config-server"; sleep 2; done
