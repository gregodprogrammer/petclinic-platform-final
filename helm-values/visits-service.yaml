nameOverride: visits-service

image:
  repository: localhost:5001/visits-service

service:
  port: 8082
  targetPort: 8082

env:
  - name: SPRING_PROFILES_ACTIVE
    value: docker,mysql
  - name: SERVER_PORT
    value: "8082"
  - name: SPRING_CLOUD_CONFIG_URI
    value: "http://config-server:8888"
  - name: SPRING_APPLICATION_JSON
    value: '{"eureka":{"client":{"serviceUrl":{"defaultZone":"http://discovery-server:8761/eureka/"}}}}'
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:mysql://mysql:3306/petclinic"
  - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
    value: "true"
  - name: SPRING_DATASOURCE_USERNAME
    value: petclinic
  - name: SPRING_DATASOURCE_PASSWORD
    value: petclinic
  - name: SPRING_SQL_INIT_MODE
    value: always
  - name: SPRING_SQL_INIT_SCHEMA_LOCATIONS
    value: "classpath:db/mysql/schema.sql"
  - name: SPRING_SQL_INIT_DATA_LOCATIONS
    value: "classpath:db/mysql/data.sql"
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: none
  - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
    value: "http://zipkin:9411/api/v2/spans"

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8082
  initialDelaySeconds: 420
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 3

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8082
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 6
  timeoutSeconds: 3

initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until nc -z config-server 8888; do echo "waiting for config-server"; sleep 2; done
  - name: wait-for-discovery-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until nc -z discovery-server 8761; do echo "waiting for discovery-server"; sleep 2; done
  - name: wait-for-mysql
    image: busybox:1.36
    command:
      - sh
      - -c
      - until nc -z mysql 3306; do echo "waiting for mysql"; sleep 2; done
