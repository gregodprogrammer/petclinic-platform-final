nameOverride: customers-service

image:
  repository: localhost:5001/customers-service

service:
  port: 8081
  targetPort: 8081

env:
  - name: SPRING_PROFILES_ACTIVE
    value: docker
  - name: SERVER_PORT
    value: "8081"

initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until nc -z config-server 8888; do echo "waiting for config-server"; sleep 2; done
  - name: wait-for-discovery-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until nc -z discovery-server 8761; do echo "waiting for discovery-server"; sleep 2; done
